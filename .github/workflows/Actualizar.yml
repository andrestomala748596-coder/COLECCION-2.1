name: AJPLAY Extractor
on:
  push:
    branches: ["**"]
    paths-ignore:
      - ".github/workflows/**"
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ajplay-extractor
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests yt-dlp
          fi
      - name: Validar urls.txt sin modificarlo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("urls.txt")
          if not p.is_file() or not p.read_text(encoding="utf-8").strip():
              raise SystemExit("ERROR: urls.txt falta o está vacío")
          data = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit("ERROR: urls.txt debe ser una lista JSON")
          print(f"Registros encontrados: {len(data)}")
          PY
      - name: Ejecutar extractor
        env:
          PYTHONUNBUFFERED: "1"
        run: python extractor.py
      - name: Verificar que urls.txt siga intacto
        run: git diff --exit-code -- urls.txt
      - name: Guardar JSON generados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- peliculas category_list.json
          if git diff --cached --quiet; then
            echo "No hay cambios en los JSON."
          else
            git commit -m "Actualizar catálogo extraído [skip ci]"
            # Integrar commits nuevos de main antes de publicar para evitar non-fast-forward.
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preparar catálogo para Supabase
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          files = sorted(Path("peliculas").glob("*.json"))
          if not files:
              raise SystemExit("ERROR: no hay JSON en peliculas/")
          movies = []
          for p in files:
              data = json.loads(p.read_text(encoding="utf-8"))
              if isinstance(data, list):
                  movies.extend(x for x in data if isinstance(x, dict))
              elif isinstance(data, dict):
                  movies.append(data)
              else:
                  raise SystemExit(f"ERROR: formato inesperado en {p}")
          if not movies:
              raise SystemExit("ERROR: catálogo vacío; no se publicará")
          Path(os.environ["RUNNER_TEMP"], "ajplay-catalog.json").write_text(
              json.dumps({"commit_sha": os.environ["GITHUB_SHA"], "peliculas": movies}, ensure_ascii=False),
              encoding="utf-8")
          print(f"Películas preparadas: {len(movies)}")
          PY
      - name: Publicar versión completa en Supabase AJPLAY
        env:
          SUPABASE_URL: https://nyjgdfqxodcmcsdaprzi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Falta el secreto SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          FUNCTION_URL="$SUPABASE_URL/functions/v1/ajplay-catalog-publish"

          # La Edge Function exige start -> chunk -> finish; no acepta el catálogo entero de una sola vez.
          python - "$RUNNER_TEMP/ajplay-catalog.json" "$RUNNER_TEMP" <<'PY'
          import json, sys
          from pathlib import Path
          source, out = Path(sys.argv[1]), Path(sys.argv[2])
          payload = json.loads(source.read_text(encoding="utf-8"))
          movies = payload.get("peliculas")
          if not isinstance(movies, list) or not movies:
              raise SystemExit("ERROR: el catálogo no contiene películas")
          if not all(isinstance(movie, dict) for movie in movies):
              raise SystemExit("ERROR: el catálogo contiene registros inválidos")
          (out / "start-request.json").write_text(json.dumps({
              "action": "start",
              "commit_sha": payload.get("commit_sha"),
              "total_peliculas": len(movies)
          }, ensure_ascii=False), encoding="utf-8")
          for old in out.glob("chunk-*.json"):
              old.unlink()
          for index in range(0, len(movies), 100):
              (out / f"chunk-{index // 100:04d}.json").write_text(
                  json.dumps(movies[index:index + 100], ensure_ascii=False),
                  encoding="utf-8")
          print(f"Catálogo validado: {len(movies)} películas en lotes de hasta 100.")
          PY

          # curl reintenta respuestas transitorias como HTTP 503, sin imprimir credenciales.
          CURL_RETRY=(--retry 5 --retry-delay 10 --retry-max-time 300 --connect-timeout 20 --max-time 300)
          start_response="$(curl --fail-with-body --silent --show-error "\${CURL_RETRY[@]}" \
            --request POST \
            --url "$FUNCTION_URL" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/start-request.json")"
          version_id="$(printf '%s' "$start_response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") and d.get("version_id"), d; print(d["version_id"])')"
          echo "Versión de catálogo iniciada."

          for batch in "$RUNNER_TEMP"/chunk-*.json; do
            python - "$batch" "$RUNNER_TEMP/chunk-request.json" "$version_id" <<'PY'
          import json, sys
          from pathlib import Path
          movies = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          Path(sys.argv[2]).write_text(json.dumps({
              "action": "chunk",
              "version_id": sys.argv[3],
              "peliculas": movies
          }, ensure_ascii=False), encoding="utf-8")
          PY
            response="$(curl --fail-with-body --silent --show-error "\${CURL_RETRY[@]}" \
              --request POST \
              --url "$FUNCTION_URL" \
              --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              --header "Content-Type: application/json" \
              --data-binary "@$RUNNER_TEMP/chunk-request.json")"
            printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d'
            echo "Lote $(basename "$batch") publicado."
          done

          python - "$RUNNER_TEMP/finish-request.json" "$version_id" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "action": "finish",
              "version_id": sys.argv[2]
          }), encoding="utf-8")
          PY
          finish_response="$(curl --fail-with-body --silent --show-error "\${CURL_RETRY[@]}" \
            --request POST \
            --url "$FUNCTION_URL" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/finish-request.json")"
          printf '%s' "$finish_response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d'
          echo "Publicación completa y activada en Supabase."

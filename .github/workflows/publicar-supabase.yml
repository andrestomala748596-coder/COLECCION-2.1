name: AJPLAY Sincronizar categorias y peliculas
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publicar-supabase.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ajplay-publicacion-directa
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar JSON existentes (sin extractor)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar registros sin perder categoria del archivo
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP" <<'PY'
          import json, sys
          from pathlib import Path

          root = Path("peliculas")
          files = sorted(root.glob("*.json"))
          if not files:
              raise SystemExit("ERROR: no hay JSON en peliculas/")

          rows = {}
          for path in files:
              default_category = path.stem
              data = json.loads(path.read_text(encoding="utf-8"))
              items = data if isinstance(data, list) else [data] if isinstance(data, dict) else None
              if items is None:
                  raise SystemExit(f"JSON inválido: {path}")

              for movie in items:
                  if not isinstance(movie, dict):
                      continue
                  category = str(movie.get("CATEGORIA") or movie.get("categoria") or default_category).strip() or default_category

                  def text_value(value):
                      if value is None or value == "":
                          return None
                      if isinstance(value, (dict, list)):
                          return json.dumps(value, ensure_ascii=False)
                      return str(value)

                  def number_value(value):
                      if value is None or value == "":
                          return None
                      try:
                          return float(value)
                      except (ValueError, TypeError):
                          return None

                  def integer_value(value):
                      if value is None or value == "":
                          return None
                      try:
                          number = float(value)
                          return int(number) if number.is_integer() else None
                      except (ValueError, TypeError):
                          return None

                  def date_value(value):
                      if value is None or value == "":
                          return None
                      from datetime import date
                      try:
                          return date.fromisoformat(str(value).strip()[:10]).isoformat()
                      except (ValueError, TypeError):
                          return None

                  tmdb_id = integer_value(movie.get("TMDB_ID"))
                  video_id = text_value(movie.get("ID_VIDEO") or movie.get("ID_OKRU"))
                  title = text_value(movie.get("TITULO")) or "Sin título"
                  key = str(tmdb_id or video_id or f"{category}:{title}")

                  row = {
                      "tmdb_id": tmdb_id,
                      "id_video": video_id,
                      "plataforma": text_value(movie.get("PLATAFORMA")),
                      "titulo": title,
                      "fecha": date_value(movie.get("FECHA")),
                      "portada": text_value(movie.get("PORTADA")),
                      "backdrop": text_value(movie.get("BACKDROP")),
                      "genero": text_value(movie.get("GENERO")),
                      "rating": number_value(movie.get("RATING")),
                      "duracion": integer_value(movie.get("DURACION")),
                      "frase_promocional": text_value(movie.get("FRASE_PROMOCIONAL")),
                      "sinopsis": text_value(movie.get("SINOPSIS")),
                      "actores": text_value(movie.get("ACTORES")),
                      "director": text_value(movie.get("DIRECTOR")),
                      "trailer": text_value(movie.get("TRAILER")),
                      "urls": [str(x) for x in (movie.get("URLS") if isinstance(movie.get("URLS"), list) else movie.get("URLS_OKRU", [])) if isinstance(x, str)],
                      "metodo": text_value(movie.get("METODO")),
                      "urls_directas": [str(x) for x in movie.get("URLS_DIRECTAS", []) if isinstance(x, str)] if isinstance(movie.get("URLS_DIRECTAS"), list) else [],
                      "url_directa": text_value(movie.get("URL_DIRECTA")),
                      "extracted_by_url": movie.get("_EXTRACTED_BY_URL") if isinstance(movie.get("_EXTRACTED_BY_URL"), dict) else {},
                      "categoria": category
                  }
                  rows[(key, category)] = row

          records = list(rows.values())
          if not records:
              raise SystemExit("ERROR: catálogo vacío")
          out = Path(sys.argv[1])
          (out / "ajplay-catalog.json").write_text(json.dumps(records, ensure_ascii=False), encoding="utf-8")
          for old in out.glob("ajplay-rest-batch-*.json"):
              old.unlink()
          for start in range(0, len(records), 50):
              (out / f"ajplay-rest-batch-{start // 50:04d}.json").write_text(
                  json.dumps(records[start:start + 50], ensure_ascii=False), encoding="utf-8")
          print(f"JSON: {len(files)}; filas únicas por identificador/categoría: {len(records)}")
          print(f"Lotes preparados: {(len(records) + 49) // 50}")
          PY

      - name: Publicar versión completa en Supabase AJPLAY
        env:
          SUPABASE_URL: https://nyjgdfqxodcmcsdaprzi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Falta el secreto SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          CURL_RETRY=(--retry 5 --retry-delay 10 --retry-max-time 300 --connect-timeout 20 --max-time 300)
          api() {
            curl --fail-with-body --silent --show-error "${CURL_RETRY[@]}" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" "$@"
          }

          python - "$RUNNER_TEMP/ajplay-catalog.json" "$RUNNER_TEMP/version-request.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          records = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not records:
              raise SystemExit("ERROR: no hay registros para publicar")
          Path(sys.argv[2]).write_text(json.dumps({
              "estado": "preparando",
              "commit_sha": sys.argv[3],
              "total_peliculas": len(records)
          }), encoding="utf-8")
          print(f"Versión preparada para {len(records)} registros.")
          PY

          version_id=""
          mark_failed() {
            if [[ -n "$version_id" ]]; then
              curl --silent --show-error --request PATCH --url "$SUPABASE_URL/rest/v1/catalogo_versiones?id=eq.$version_id" --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" --header "Content-Type: application/json" --header "Prefer: return=minimal" --data '{"estado":"fallido"}' >/dev/null || true
            fi
          }
          trap mark_failed ERR

          start_response="$(api --request POST --url "$SUPABASE_URL/rest/v1/catalogo_versiones?select=id" --header "Prefer: return=representation" --data-binary "@$RUNNER_TEMP/version-request.json")"
          version_id="$(printf '%s' "$start_response" | python -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d,list) and d and d[0].get("id"), d; print(d[0]["id"])')"
          echo "Versión de catálogo creada."

          for batch in "$RUNNER_TEMP"/ajplay-rest-batch-*.json; do
            python - "$batch" "$RUNNER_TEMP/versioned-batch.json" "$version_id" <<'PY'
          import json, sys
          from pathlib import Path
          records = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for row in records:
              row["version_id"] = sys.argv[3]
          Path(sys.argv[2]).write_text(json.dumps(records, ensure_ascii=False), encoding="utf-8")
          PY
            api --request POST --url "$SUPABASE_URL/rest/v1/peliculas" --header "Prefer: return=minimal" --data-binary "@$RUNNER_TEMP/versioned-batch.json" >/dev/null
            echo "Lote $(basename "$batch") insertado."
          done

          python - "$RUNNER_TEMP/finish-request.json" "$version_id" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({"p_version_id": sys.argv[2]}), encoding="utf-8")
          PY
          api --request POST --url "$SUPABASE_URL/rest/v1/rpc/ajplay_publish_catalog_version" --data-binary "@$RUNNER_TEMP/finish-request.json" >/dev/null
          version_id=""
          trap - ERR
          echo "Publicación completa: versión activada en Supabase; conteo validado por RPC."

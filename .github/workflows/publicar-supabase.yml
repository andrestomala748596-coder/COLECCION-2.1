name: AJPLAY Sincronizar categorias y peliculas
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publicar-supabase.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ajplay-publicacion-directa
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar JSON existentes (sin extractor)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar catálogo completo conservando categorías
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP" "$GITHUB_SHA" <<'PY'
          import json, os, sys
          from pathlib import Path

          root = Path("peliculas")
          files = sorted(root.glob("*.json"))
          if not files:
              raise SystemExit("ERROR: no hay JSON en peliculas/")

          rows = {}
          for path in files:
              default_category = path.stem
              data = json.loads(path.read_text(encoding="utf-8"))
              items = data if isinstance(data, list) else [data] if isinstance(data, dict) else None
              if items is None:
                  raise SystemExit(f"JSON inválido: {path}")

              for movie in items:
                  if not isinstance(movie, dict):
                      continue
                  category = str(movie.get("CATEGORIA") or movie.get("categoria") or default_category).strip() or default_category
                  tmdb_id = movie.get("TMDB_ID")
                  video_id = movie.get("ID_VIDEO") or movie.get("ID_OKRU")
                  title = movie.get("TITULO") or "Sin título"
                  key = str(tmdb_id or video_id or f"{category}:{title}")

                  # La Edge Function consume las claves del JSON original.
                  row = dict(movie)
                  row["CATEGORIA"] = category
                  row["ID_VIDEO"] = video_id
                  row["URLS"] = movie.get("URLS") if isinstance(movie.get("URLS"), list) else (
                      movie.get("URLS_OKRU") if isinstance(movie.get("URLS_OKRU"), list) else []
                  )
                  row["URLS_DIRECTAS"] = movie.get("URLS_DIRECTAS") if isinstance(movie.get("URLS_DIRECTAS"), list) else []
                  row["_EXTRACTED_BY_URL"] = movie.get("_EXTRACTED_BY_URL") if isinstance(movie.get("_EXTRACTED_BY_URL"), dict) else {}
                  rows[(key, category)] = row

          movies = list(rows.values())
          if not movies:
              raise SystemExit("ERROR: catálogo vacío; no se publicará")
          out = Path(sys.argv[1])
          (out / "ajplay-catalog.json").write_text(json.dumps({
              "commit_sha": sys.argv[2],
              "peliculas": movies
          }, ensure_ascii=False), encoding="utf-8")

          for old in out.glob("ajplay-chunk-*.json"):
              old.unlink()
          for start in range(0, len(movies), 100):
              (out / f"ajplay-chunk-{start // 100:04d}.json").write_text(
                  json.dumps(movies[start:start + 100], ensure_ascii=False),
                  encoding="utf-8"
              )
          print(f"JSON: {len(files)}; registros únicos por identificador/categoría: {len(movies)}")
          print("Categorías: " + ", ".join(sorted({r["CATEGORIA"] for r in movies})))
          print(f"Lotes preparados: {(len(movies) + 99) // 100}")
          PY

      - name: Publicar versión completa en Supabase AJPLAY
        env:
          SUPABASE_URL: https://nyjgdfqxodcmcsdaprzi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Falta el secreto SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          FUNCTION_URL="$SUPABASE_URL/functions/v1/ajplay-catalog-publish"
          CURL_RETRY=(--retry 5 --retry-delay 10 --retry-max-time 300 --connect-timeout 20 --max-time 300)

          python - "$RUNNER_TEMP/ajplay-catalog.json" "$RUNNER_TEMP/ajplay-start.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          movies = payload.get("peliculas")
          if not isinstance(movies, list) or not movies:
              raise SystemExit("ERROR: catálogo sin películas")
          Path(sys.argv[2]).write_text(json.dumps({
              "action": "start",
              "commit_sha": payload.get("commit_sha"),
              "total_peliculas": len(movies)
          }), encoding="utf-8")
          PY

          start_response="$(curl --fail-with-body --silent --show-error "${CURL_RETRY[@]}"             --request POST             --url "$FUNCTION_URL"             --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             --header "apikey: $SUPABASE_SERVICE_ROLE_KEY"             --header "Content-Type: application/json"             --data-binary "@$RUNNER_TEMP/ajplay-start.json")"
          version_id="$(printf '%s' "$start_response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") and d.get("version_id"), d; print(d["version_id"])')"
          echo "Versión de catálogo creada."

          for batch in "$RUNNER_TEMP"/ajplay-chunk-*.json; do
            python - "$batch" "$RUNNER_TEMP/ajplay-chunk-request.json" "$version_id" <<'PY'
          import json, sys
          from pathlib import Path
          movies = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          Path(sys.argv[2]).write_text(json.dumps({
              "action": "chunk",
              "version_id": sys.argv[3],
              "peliculas": movies
          }, ensure_ascii=False), encoding="utf-8")
          PY
            response="$(curl --fail-with-body --silent --show-error "${CURL_RETRY[@]}"               --request POST               --url "$FUNCTION_URL"               --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"               --header "apikey: $SUPABASE_SERVICE_ROLE_KEY"               --header "Content-Type: application/json"               --data-binary "@$RUNNER_TEMP/ajplay-chunk-request.json")"
            printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d'
            echo "Publicado $(basename "$batch")."
          done

          python - "$RUNNER_TEMP/ajplay-finish.json" "$version_id" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "action": "finish",
              "version_id": sys.argv[2]
          }), encoding="utf-8")
          PY
          finish_response="$(curl --fail-with-body --silent --show-error "${CURL_RETRY[@]}"             --request POST             --url "$FUNCTION_URL"             --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             --header "apikey: $SUPABASE_SERVICE_ROLE_KEY"             --header "Content-Type: application/json"             --data-binary "@$RUNNER_TEMP/ajplay-finish.json")"
          printf '%s' "$finish_response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d'
          echo "Catálogo publicado y activado correctamente."
